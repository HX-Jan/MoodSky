name: MoodSky CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: moodsky-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm ci --prefix cloudfunctions/moodsky
      - run: npm ci --prefix admin --ignore-scripts
      - run: npm run build --prefix admin
      - run: npm run check
      - run: npm audit --audit-level=high --prefix admin
      - run: npm audit --audit-level=high --prefix cloudfunctions/moodsky
      - run: npm audit --audit-level=high --prefix tools/h03-probe
      - run: node scripts/check-cloud.js
